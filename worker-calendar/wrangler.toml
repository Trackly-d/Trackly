# ==========================================================
# TRACKLY calendar worker: Wrangler settings
# Secrets (the Google client secret and the master key) are NOT written here. See README.md.
# ==========================================================

name = "trackly-calendar"
main = "index.js"
compatibility_date = "2025-10-01"

# KV is a small storage box. Here it keeps each student's Google token, ENCRYPTED.
# 1. Run:  npx wrangler kv namespace create CALENDAR
# 2. Paste the id it prints in place of the text below.
[[kv_namespaces]]
binding = "CALENDAR"
id = "250f6f11d16348eda9d9aa37e0602b5d"

# These are settings, not secrets. They are safe to keep in this file.
[vars]
FIREBASE_PROJECT_ID = "trackly-e18d8"
GOOGLE_CLIENT_ID = "456861780906-oe2ff5m50ju972dmkf3bg81a59k2nv31.apps.googleusercontent.com"
# Where Google sends the student back. It must match the Google console EXACTLY.
REDIRECT_URI = "https://trackly-calendar.trackly409.workers.dev/google/callback"
# Websites allowed to use this Worker, separated by commas. Add your Firebase Hosting address when you deploy.
ALLOWED_ORIGINS = "https://trackly.ng,https://www.trackly.ng,https://trackly-e18d8.web.app,https://trackly-e18d8.firebaseapp.com,http://127.0.0.1:5000,http://localhost:5000,http://127.0.0.1:5500,http://localhost:5500"