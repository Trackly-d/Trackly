<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Courses | Trackly</title>
  <!-- Signed in pages are private and kept out of Google -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles: base, components, the app frame, then this page -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/courses.css">
</head>
<body>
  <!-- Hidden until Firebase confirms the student is signed in -->
  <div class="app-layout" id="app" hidden>
    <div class="app-backdrop" id="backdrop" hidden></div>

    <!-- Sidebar and top bar are built by js/shell.js -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="app-content">
        <div class="courses">

          <div class="courses-head">
            <div>
              <h1>My Courses <span class="term-pill" id="term-pill" hidden></span></h1>
              <p class="courses-sub" id="courses-sub">Loading your courses...</p>
            </div>
            <div class="courses-tools">
              <label class="filter">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="course-filter" placeholder="Filter courses..." aria-label="Filter courses" autocomplete="off">
              </label>
              <!-- data-soon shows "Coming soon" until add-course.html is built. Then delete data-soon. -->
              <a class="btn btn-primary btn-new" href="add-course.html" data-soon>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Course
              </a>
            </div>
          </div>

          <!-- Summary numbers: filled in by js/courses-page.js -->
          <section class="stats" aria-label="Summary">
            <div class="stat">
              <span class="stat-icon tile-mint" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              </span>
              <div>
                <p class="stat-label">Total assignments</p>
                <p class="stat-value stat-caps" id="stat-total">&mdash;</p>
              </div>
            </div>

            <div class="stat">
              <span class="stat-icon tile-mint" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
              <div>
                <p class="stat-label">Next deadline</p>
                <p class="stat-value" id="stat-next">&mdash;</p>
              </div>
            </div>

            <div class="stat">
              <span class="stat-icon tile-lavender" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              </span>
              <div>
                <p class="stat-label">Term completion</p>
                <p class="stat-value" id="stat-completion">&mdash;</p>
              </div>
            </div>

            <div class="pace">
              <div>
                <p class="stat-label">Weekly pace</p>
                <p class="stat-value" id="stat-pace">&mdash;</p>
              </div>
              <!-- Decorative line for now, it does not show real data yet -->
              <svg class="pace-line" viewBox="0 0 64 24" fill="none" stroke="var(--color-link)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2,18 14,13 26,16 38,8 50,11 62,3"/></svg>
            </div>
          </section>

          <!-- Course cards are drawn here by js/courses-page.js -->
          <section class="course-grid" id="course-grid" aria-label="Your courses"></section>

          <p class="no-match" id="no-match" hidden>No courses match your search.</p>

          <div class="load-error" id="courses-error" role="alert" hidden>
            <p>We could not load your courses. Check your connection and try again.</p>
            <button class="btn btn-outline-link btn-retry" type="button" id="retry-btn">Try again</button>
          </div>

        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/courses-page.js"></script>
</body>
</html>
