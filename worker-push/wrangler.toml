# ==========================================================
# TRACKLY push worker: Wrangler settings
# Secrets are NOT written here. The private VAPID key is stored with:  npx wrangler secret put VAPID_PRIVATE_JWK
# ==========================================================

name = "trackly-push"
main = "index.js"
compatibility_date = "2025-10-01"

# Runs every minute to send due soon and overdue pushes. The free plan allows 5 cron triggers in total.
[triggers]
crons = ["* * * * *"]

# D1 is a small database. It keeps push addresses, push choices and the assignments waiting for a push.
# 1. Run:  npx wrangler d1 create trackly-push
# 2. Paste the database_id it prints in place of the text below.
# 3. Run:  npx wrangler d1 execute trackly-push --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "trackly-push"
database_id = "dec9f95d-0dbf-4f6f-8dde-db5c3a78dbb5"

# These are settings, not secrets. They are safe to keep in this file.
[vars]
FIREBASE_PROJECT_ID = "trackly-e18d8"
# The PUBLIC key printed by make-vapid-keys.mjs
VAPID_PUBLIC_KEY = "BLKDPn-IZkxxlyeIva7P6IOUPB2T_iKNAojHpNWrX9puyQH_VrzblUHjWZjsgNno3jYMErBwTzuiINIXe_Ou9B4"
# Who is sending (push services want a website or an email here)
VAPID_SUBJECT = "https://trackly.ng"
# Websites allowed to use this Worker, separated by commas.
ALLOWED_ORIGINS = "https://trackly.ng,https://www.trackly.ng,https://trackly-e18d8.web.app,https://trackly-e18d8.firebaseapp.com,http://127.0.0.1:5000,http://localhost:5000,http://127.0.0.1:5500,http://localhost:5500"
