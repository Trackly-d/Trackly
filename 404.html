<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Trackly</title>
  <meta name="description" content="This page could not be found. Go back to the Trackly home page.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E5C4A">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96.png">
  <!--
    Firebase Hosting shows this file for any address that does not exist, at ANY depth (for example /a/b/c),
    so every link and image here starts with / and everything else is inside this file.
  -->
  <style>
:root{--green:#00C58E;--bright:#00D996;--dark:#0E5C4A;--ink:#0F172A;--muted:#475569;--bg:#F8F8FF;--line:#E2E8F0;--chip:#EEF0FF}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:8px;z-index:10;padding:10px 14px;border-radius:8px;background:var(--ink);color:#fff}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:2px solid transparent;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none}
.btn-primary{background:var(--green);color:#04281F}
.btn-primary:hover{background:var(--bright)}
.btn-ghost{border-color:var(--line);background:#fff}
.btn-ghost:hover{border-color:var(--dark)}
.btn-lg{min-height:52px;padding:0 28px;font-size:16px}
body{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#F8F8FF,#fff)}
main{flex:1;display:grid;place-items:center;padding:48px 20px;text-align:center}
.box{max-width:520px}
.code{margin:0 0 8px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dark)}
h1{margin:0 0 12px;font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.15}
p{margin:0 0 24px;font-size:18px;color:var(--muted)}
.logo{display:block;width:140px;height:auto;margin:0 auto 32px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  </style>
</head>
<body>
  <main>
    <div class="box">
      <a href="/" aria-label="Trackly home"><img class="logo" src="/assets/images/logo.webp" alt="Trackly" width="360" height="114"></a>
      <p class="code">Error 404</p>
      <h1>We could not find that page</h1>
      <p>The link may be old or mistyped. Let us get you back on track.</p>
      <div class="row">
        <a class="btn btn-primary btn-lg" href="/">Go to the home page</a>
        <a class="btn btn-ghost btn-lg" href="/login.html#signin">Sign in</a>
      </div>
    </div>
  </main>
</body>
</html>
