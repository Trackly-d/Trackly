<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a new Trackly password</title>
  <meta name="description" content="Choose a new password for your Trackly account.">
  <!-- Account pages are kept out of Google on purpose. The public home page (index.html) is the one built to rank. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Styles: base, components, shared auth layout. This page needs nothing extra. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">

    <!-- LEFT: green brand panel (same as the other auth pages) -->
    <aside class="auth-brand">
      <img class="auth-logo" src="assets/images/trackly-logo.png" alt="Trackly" width="1774" height="887">
      <p class="auth-tagline">One app. Every deadline.</p>
    </aside>

    <!-- RIGHT: form panel -->
    <section class="auth-panel">
      <div class="auth-content">
        <div class="view">

          <div class="step-row">
            <a class="back-btn" href="login.html#signin" aria-label="Back to sign in">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
          </div>

          <div class="view-heading">
            <h1>Create new password</h1>
            <p>Make it strong and easy to remember</p>
          </div>

          <form id="reset-form" class="stack-form" novalidate>
            <div class="field">
              <label class="label" for="new-password">New Password</label>
              <div class="input-wrap">
                <input class="input" type="password" id="new-password" name="password" placeholder="Create a new password" autocomplete="new-password" minlength="8" aria-describedby="strength-text" required>
                <button class="toggle-password" type="button" id="toggle-new" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>

              <!-- Strength bar: JavaScript sets data-level to 0, 1, 2 or 3 -->
              <div class="strength" id="password-strength" data-level="0" aria-live="polite">
                <div class="strength-bars" aria-hidden="true"><span></span><span></span><span></span></div>
                <p class="strength-text" id="strength-text">Use at least 8 characters, with numbers and symbols</p>
              </div>
            </div>

            <div class="field">
              <label class="label" for="confirm-password">Confirm New Password</label>
              <div class="input-wrap">
                <input class="input" type="password" id="confirm-password" name="confirm" placeholder="Confirm your new password" autocomplete="new-password" required>
                <button class="toggle-password" type="button" id="toggle-confirm" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <!-- Error messages appear here once JavaScript is added -->
            <p class="form-error" id="reset-error" role="alert" hidden></p>

            <button class="btn btn-primary" type="submit" id="reset-submit">Save Password</button>
          </form>

          <!-- Shown by JavaScript only when the reset link is expired or invalid. Needs a design from the designer. -->
          <a class="btn btn-outline-link" id="request-new-link" href="forgot-password.html" hidden>Request a new link</a>

          <p class="text-center"><a class="link-quiet" href="login.html#signin">Back to Sign In</a></p>

        </div>
      </div>
    </section>

  </main>

  <script type="module" src="js/reset-password-page.js"></script>
</body>
</html>
